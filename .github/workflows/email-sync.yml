name: Gmail Sync

on:
  schedule:
    # Every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Gmail sync via Edge Function
        run: |
          curl -s -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/gmail-sync" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -d '{"action":"sync"}'
